name: Deploy to Firebase

on:
  push:
    branches:
      - claude/hopeful-bardeen-m9640g

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyBwcwjVAqplREvRoENvOc7TYn5wHVWZDOU
          VITE_FIREBASE_AUTH_DOMAIN: gracemembers-d0fd5.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: gracemembers-d0fd5
          VITE_FIREBASE_STORAGE_BUCKET: gracemembers-d0fd5.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "1072652752156"
          VITE_FIREBASE_APP_ID: "1:1072652752156:web:63dc9d9d7235d5f4ccd6d9"

      - name: Write service account key
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/gcp-key.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting + Firestore rules
        run: npx firebase-tools deploy --only hosting,firestore --project gracemembers-d0fd5 --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
